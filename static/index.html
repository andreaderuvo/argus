<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Argus</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm-6.0.0/xterm.css">
<link rel="stylesheet" href="/style.css">
<!-- three.js's own addons import it by bare name — `from 'three'` — which is how the
     project ships them and not something to rewrite by hand every time the vendored copy
     is upgraded. An import map resolves that name to the vendored file, standards-based,
     no bundler: the one thing a build step would otherwise be for here. -->
<script type="importmap">
{ "imports": { "three": "/vendor/three-0.185.1/three.module.min.js" } }
</script>
<script>
  // Inline and before the stylesheet paints, or a dark-theme user gets a white flash on
  // every load. The module below owns the preference; this only replays it.
  try {
    var raw = localStorage.getItem('argus.prefs') || localStorage.getItem('tmuxc.prefs') || '{}';
    var t = JSON.parse(raw).theme || 'dark';
    if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>

<header id="bar">
  <!-- First, before the title: a menu button belongs where a thumb goes looking for one and
       where every app on a phone puts it. Among the icons at the other end it reads as one
       more action rather than as the way out of this screen. -->
  <button id="hamburger" class="icon" aria-label="Menu" title="Menu"><span data-icon="menu"></span></button>
  <button id="back" class="icon" hidden aria-label="Back" data-icon="back"></button>
  <h1 id="title">Argus</h1>
  <button id="alt" class="icon" hidden></button>
  <!-- Where the document is: the same `i` a terminal wears, meaning the same thing. -->
  <button id="docwhere" class="icon twist docwhere" hidden></button>
  <button id="fullscreen" class="icon" hidden aria-label="Full screen" title="Full screen" data-icon="expand"></button>
  <!-- Hidden until the first reading comes back, so it never claims the machine is fine
       before it actually knows. Quiet by default — coloured only once something is
       actually high or critical — and opens the System screen it is a shorthand for. -->
  <button id="vitals" class="icon" hidden aria-label="System" title="System" data-icon="activity"></button>
  <!-- Hidden until the server says where a drop lands, and unlike the desk's own "Browser"
       button this one is reachable from wherever you are — a document, Settings, the Wall
       itself — because a dropped file or a big paste can happen on any desk and this is
       the one place all of them end up. -->
  <button id="drops" class="icon" hidden data-icon="folderPlus"></button>
  <button id="keys" class="icon" aria-label="Keyboard shortcuts" title="Keyboard shortcuts" data-icon="keyboard"></button>
  <button id="about" class="icon" aria-label="Argus on GitHub" title="Argus on GitHub" data-icon="github"></button>
  <button id="settings" class="icon" aria-label="Settings" title="Settings" data-icon="settings"></button>
  <button id="action" class="icon" hidden></button>
</header>

<div id="shell">
  <aside id="side"></aside>
  <main id="view"></main>
</div>

<nav id="nav" hidden>
  <button id="railtoggle" class="icon" aria-label="Wider or narrower"><span data-icon="menu"></span><span class="railname"></span></button>
  <a href="#/files" data-tab="files"><span data-icon="folder"></span>Files</a>
  <a href="#/sessions" data-tab="sessions"><span data-icon="terminal"></span>Sessions</a>
  <a href="#/wall" data-tab="wall"><span data-icon="grid"></span>Windows</a>
  <a href="#/prompts" data-tab="prompts"><span data-icon="relay"></span>Prompts</a>
  <a href="#/placeholders" data-tab="placeholders"><span data-icon="rename"></span>Values</a>
  <a href="#/todo" data-tab="todo"><span data-icon="tick"></span>To do</a>
  <a href="#/system" data-tab="system"><span data-icon="activity"></span>System</a>
  <!-- The first thing worth opening after being away: what changed, rather than what is.
       Above the journal because that one is history and this one is news. -->
  <a href="#/since" data-tab="since"><span data-icon="bell"></span>Since</a>
  <!-- What has been done here, and what was refused. Last among the destinations because it
       is the one you open when something has already surprised you. -->
  <a href="#/journal" data-tab="journal"><span data-icon="journal"></span>Journal</a>
  <!-- The rest of the destinations, on a phone. Four fit across the bottom with room for a
       badge; the other three live behind this and open as a drawer. -->
  <button id="more" class="icon" aria-label="More"><span data-icon="more"></span>More</button>
  <!-- Desks put away. Between the destinations and the windows because that is what they
       are between: a parked desk is somewhere you go, and it is not somewhere the app goes.
       Unlike the windows below, these stay visible wherever you are — the reason to glance
       at a parked desk is that something in it may be asking for you. -->
  <div id="raildesks"></div>
  <!-- What is open in the desk you are on. Filled in by the script; empty on a phone,
       where the rail does not exist and the bottom bar is the navigation. -->
  <div id="railwins"></div>
  <!-- The file panel is a layout switch, not a destination, so it sits at the far end of
       the rail rather than among the places you can go. It was in the header, which had
       eight buttons in it and no room for opinions. -->
  <button id="sidetoggle" class="icon" aria-label="Toggle the file sidebar" title="File sidebar"><span data-icon="sidebar"></span><span class="railname"></span></button>
</nav>

<!-- Where a terminal waits while you are looking at another screen. -->
<div id="keep" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
