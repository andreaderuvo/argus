[package]
name = "tmux-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Mobile-first web companion for tmux sessions and file browsing"
license = "MIT"

[[bin]]
name = "tmux-companion"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }

futures-util = "0.3"
portable-pty = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
subtle = "2"
mime_guess = "2"
walkdir = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
