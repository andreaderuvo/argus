name: debug-runner
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          ls -l /bin/sh; echo "SHELL=$SHELL"; getent passwd "$USER"; id
          ls /etc/profile.d/; tmux -V
          bash -lc 'echo LOGIN-SHELL-DONE' 2>&1 | head -20
          printf '#!/bin/sh\nwhile :; do printf .; sleep 0.2; done\n' > /tmp/claude; chmod +x /tmp/claude
          tmux -L dbg -f /dev/null new-session -d -s busy -x 80 -y 20 /tmp/claude
          sleep 2
          tmux -L dbg list-panes -a -F '#{session_name} pid=#{pane_pid} cmd=#{pane_current_command} start=#{pane_start_command} tty=#{pane_tty}'
          P=$(tmux -L dbg list-panes -a -F '#{pane_pid}' | head -1)
          ps -o pid,ppid,comm,args --ppid "$P" -p "$P"
          cat /proc/$P/cmdline | tr '\0' ' '; echo; cut -c1-80 /proc/$P/stat
          ps -ww -eo pid,ppid,tty,comm,args | grep -v grep | grep -E 'claude|tmux' | head
          printf '#!/bin/sh\nsleep 3\nprintf "banner\\n> "\nread x\n' > /tmp/late; chmod +x /tmp/late
          tmux -L dbg new-session -d -s late -x 80 -y 20 "sleep 0.3; exec \"\${SHELL:-/bin/sh}\" -l -c 'exec /tmp/late'"
          tmux -L dbg pipe-pane -o -t late 'cat >> /tmp/late.out'
          for i in 1 2 3 4 5 6 7 8; do sleep 0.5; echo "t=$i activity=$(tmux -L dbg display -p -t late '#{window_activity}') bytes=$(wc -c < /tmp/late.out 2>/dev/null)"; done
          od -c /tmp/late.out | head -20
          tmux -L dbg kill-server
