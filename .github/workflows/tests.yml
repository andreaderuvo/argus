name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  # By hand as well: when Actions has an incident the queued runs are cancelled rather
  # than retried, and a commit can end up with no run at all through nobody's fault.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor: the PTY bridge uses os.login_tty.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # tmux is not needed — nothing here drives a real server — but pandoc decides
      # whether the Word-document tests run or skip, so it is worth having.
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      # The wiki is a separate repository, and one test wants to read it: every public name in
      # `tools/` has to be named on a page. Without this the test skips, which is right on a
      # laptop and wrong here — here is the only place the two repositories are ever seen
      # together, so here is where the drift has to be caught.
      - name: the wiki, for the documentation check
        run: git clone --depth 1 https://github.com/andreaderuvo/argus.wiki.git "$RUNNER_TEMP/wiki" || true
      - run: python -m pytest -q
        env:
          ARGUS_WIKI: ${{ runner.temp }}/wiki
