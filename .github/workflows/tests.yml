name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  # By hand as well: when Actions has an incident the queued runs are cancelled rather
  # than retried, and a commit can end up with no run at all through nobody's fault.
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Every version reports: a failure on one used to cancel the other two, and hid whatever
      # they would have said.
      fail-fast: false
      matrix:
        # 3.11 is the floor: the PTY bridge uses os.login_tty.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      # tmux is not needed — nothing here drives a real server — but pandoc decides
      # whether the Word-document tests run or skip, so it is worth having.
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      # Which tmux the runner has: the tests that drive a real one depend on it, and the image moves.
      - run: tmux -V; uname -a; cat /etc/os-release | head -2
      # The wiki is a separate repository, and one test wants to read it: every public name in
      # `tools/` has to be named on a page. Without this the test skips, which is right on a
      # laptop and wrong here — here is the only place the two repositories are ever seen
      # together, so here is where the drift has to be caught.
      - name: the wiki, for the documentation check
        run: git clone --depth 1 https://github.com/andreaderuvo/argus.wiki.git "$RUNNER_TEMP/wiki" || true
      # The browser suite runs once, in its own job below — not three times here.
      - run: python -m pytest -q -n 4 --durations=10 -m "not browser"
        env:
          ARGUS_WIKI: ${{ runner.temp }}/wiki

  frontend:
    # The frontend has no build step, so this is its compiler: ESLint for names used but never
    # declared or imported, the module graph against the service worker's list, and a real
    # Chromium driving a real Argus on a tmux socket of its own. REQUIRED=1 turns "no browser
    # here" from a skip into a failure: a runner that lost Chrome must not pass by testing
    # nothing.
    #
    # Split across four machines (scripts/ci_shard.py, balanced by tests per file): on one it took eight
    # minutes, the whole of the wait for a push (2026-11-10).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tmux poppler-utils
      # The ten slowest tests named in every run: what to look at first when it grows.
      - run: python -m pytest -q -n 4 --durations=10 $(python scripts/ci_shard.py ${{ matrix.shard }} 4 tests/test_modules.py tests/browser tests/test_computers.py tests/test_argus_browser.py)
        env:
          ARGUS_BROWSER_REQUIRED: '1'
          ARGUS_CHROMIUM: /usr/bin/google-chrome
          ARGUS_FAIL_SHOTS: ${{ runner.temp }}/shots
      # What the page showed when a test failed: the one thing a log cannot say.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-pages-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
