name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['app/**', 'static/**', 'tools/**', 'pyproject.toml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/argus" --version
          "$RUNNER_TEMP/wheel/bin/python" -c 'from argus_workspace.main import STATIC_DIR; assert (STATIC_DIR / "index.html").is_file(), STATIC_DIR'
      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md <<'PY'
          import pathlib, re, sys
          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path(sys.argv[2]).read_text()
          match = re.search(rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              raise SystemExit(f"no changelog section for {version}")
          print(match.group(1).strip())
          PY
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Argus $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

  container:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
