name: Feature request
description: A workflow Argus could make simpler
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or friction before proposing a particular interface.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
  - type: textarea
    id: idea
    attributes:
      label: What would a good result look like?
  - type: dropdown
    id: surface
    attributes:
      label: Where does this matter?
      options: [Desktop browser, Phone, CLI or API, Panoptes fleet board, Everywhere]
